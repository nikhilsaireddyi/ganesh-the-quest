<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GANESH: THE QUEST</title>
    <meta name="description" content="GANESH: THE QUEST - A Cinematic 2D/2.5D Indian Festival Adventure Game" />
    <meta name="theme-color" content="#ff7700" />
    <link rel="icon" type="image/x-icon" href="/src/icon.ico" />
    <link rel="shortcut icon" href="/src/icon.ico" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
      <div id="audio-banner">🎵 Click or Tap anywhere to enable festival sound</div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Clean up legacy service workers & stale browser caches automatically
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          for (const key of keys) {
            caches.delete(key);
          }
        });
      }
    </script>
  </body>
</html>
